<header class="h-[52px] bg-zinc-100 dark:bg-zinc-900 border-b border-zinc-200/80 dark:border-zinc-800 flex items-center justify-end px-6 gap-2 shrink-0">
  <button
    (click)="theme.toggle()"
    class="inline-flex items-center gap-1.5 h-7 px-3 rounded-md text-xs font-medium text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-100 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 hover:border-zinc-300 dark:hover:border-zinc-600 shadow-sm transition-all duration-100"
    aria-label="Toggle dark mode"
  >
    <svg *ngIf="theme.dark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg *ngIf="!theme.dark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
  <button
    (click)="toggleLang()"
    class="inline-flex items-center gap-1.5 h-7 px-3 rounded-md text-xs font-medium text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-100 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 hover:border-zinc-300 dark:hover:border-zinc-600 shadow-sm transition-all duration-100"
  >
    <span class="text-sm leading-none">{{ lang === 'el' ? '🇬🇧' : '🇬🇷' }}</span>
    {{ lang === 'el' ? 'English' : 'Ελληνικά' }}
  </button>
</header>
