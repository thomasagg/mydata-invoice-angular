<aside class="w-52 bg-zinc-900 flex flex-col h-full shrink-0">
  <div class="px-4 h-14 flex items-center border-b border-white/10">
    <span class="text-sm font-semibold text-white">myDATA</span>
  </div>

  <nav class="flex-1 px-2 py-3 flex flex-col gap-0.5">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.to"
      [routerLinkActiveOptions]="{ exact: item.exact }"
      routerLinkActive="bg-white/10 text-white"
      class="h-8 px-3 rounded-md text-sm font-medium transition-colors flex items-center text-zinc-400 hover:text-white hover:bg-white/5"
    >
      {{ item.label }}
    </a>
  </nav>

  <div class="px-2 py-3 border-t border-white/10">
    <button
      (click)="logout()"
      class="h-8 px-3 rounded-md text-sm font-medium text-zinc-500 hover:text-red-400 hover:bg-red-500/10 transition-colors w-full text-left"
    >
      Logout
    </button>
  </div>
</aside>
