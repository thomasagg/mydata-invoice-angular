<div class="p-8">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-xl font-bold text-zinc-900">Clients</h1>
    <button
      (click)="openAdd()"
      class="h-8 px-4 bg-zinc-900 hover:bg-zinc-700 text-white text-sm font-medium rounded-lg transition-colors"
    >
      + Add Client
    </button>
  </div>

  <div *ngIf="showForm" class="bg-white rounded-xl border border-zinc-200 shadow-sm p-6 mb-5">
    <h3 class="text-sm font-semibold text-zinc-800 mb-4">{{ editingId ? 'Edit Client' : 'New Client' }}</h3>

    <div *ngIf="error" class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2 mb-4">
      {{ error }}
    </div>

    <form (ngSubmit)="submit()" class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-1.5">Name</label>
        <input class="w-full h-9 border border-zinc-300 rounded-lg px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [(ngModel)]="form.name" name="name" required />
      </div>
      <div>
        <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-1.5">AFM</label>
        <input class="w-full h-9 border border-zinc-300 rounded-lg px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [(ngModel)]="form.afm" name="afm" required />
      </div>
      <div>
        <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-1.5">Address</label>
        <input class="w-full h-9 border border-zinc-300 rounded-lg px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [(ngModel)]="form.address" name="address" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-1.5">City</label>
        <input class="w-full h-9 border border-zinc-300 rounded-lg px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [(ngModel)]="form.city" name="city" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-1.5">Country</label>
        <input class="w-full h-9 border border-zinc-300 rounded-lg px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [(ngModel)]="form.country" name="country" />
      </div>
      <div class="col-span-2 flex gap-2 justify-end pt-1">
        <button type="button" (click)="showForm = false"
          class="h-8 px-4 text-sm font-medium text-zinc-600 bg-white border border-zinc-200 rounded-lg hover:border-zinc-300 transition-colors">
          Cancel
        </button>
        <button type="submit"
          class="h-8 px-4 text-sm font-medium bg-zinc-900 hover:bg-zinc-700 text-white rounded-lg transition-colors">
          Save
        </button>
      </div>
    </form>
  </div>

  <div class="bg-white rounded-xl border border-zinc-200 shadow-sm overflow-hidden">
    <div *ngIf="clients.length === 0" class="flex items-center justify-center py-16 text-sm text-zinc-400">
      No clients yet.
    </div>

    <table *ngIf="clients.length > 0" class="w-full text-sm">
      <thead>
        <tr class="border-b border-zinc-100">
          <th class="text-left px-5 py-3 text-xs font-semibold text-zinc-400 uppercase tracking-wider">Name</th>
          <th class="text-left px-5 py-3 text-xs font-semibold text-zinc-400 uppercase tracking-wider">AFM</th>
          <th class="text-left px-5 py-3 text-xs font-semibold text-zinc-400 uppercase tracking-wider">City</th>
          <th class="text-left px-5 py-3 text-xs font-semibold text-zinc-400 uppercase tracking-wider">Country</th>
          <th class="px-5 py-3"></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-zinc-50">
        <tr *ngFor="let c of clients" class="hover:bg-zinc-50 transition-colors group">
          <td class="px-5 py-3.5 font-medium text-zinc-800">{{ c.name }}</td>
          <td class="px-5 py-3.5 font-mono text-zinc-500">{{ c.afm }}</td>
          <td class="px-5 py-3.5 text-zinc-500">{{ c.city }}</td>
          <td class="px-5 py-3.5 text-zinc-500">{{ c.country }}</td>
          <td class="px-5 py-3.5">
            <div class="flex gap-3 justify-end opacity-0 group-hover:opacity-100 transition-opacity">
              <button (click)="openEdit(c)" class="text-xs font-medium text-zinc-500 hover:text-blue-600 transition-colors">
                Edit
              </button>
              <button (click)="remove(c.id!)" class="text-xs font-medium text-zinc-400 hover:text-red-500 transition-colors">
                Delete
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
