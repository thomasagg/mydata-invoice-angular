<div class="min-h-screen bg-zinc-100 dark:bg-zinc-950 flex items-center justify-center">
  <div class="bg-white dark:bg-zinc-900 rounded-xl border border-zinc-200 dark:border-zinc-700 shadow-sm p-8 w-full max-w-sm">
    <h1 class="text-xl font-bold text-zinc-900 dark:text-zinc-100 mb-6">{{ 'login.title' | translate }}</h1>

    <div *ngIf="error" class="text-sm text-red-600 bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-800 rounded-lg px-3 py-2 mb-4">
      {{ error | translate }}
    </div>

    <form (ngSubmit)="submit()" #f="ngForm">
      <div class="mb-4">
        <label class="block text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider mb-1.5">{{ 'login.username' | translate }}</label>
        <input
          class="w-full h-9 border border-zinc-300 dark:border-zinc-600 rounded-lg px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100"
          [(ngModel)]="username"
          name="username"
          required
        />
      </div>

      <div class="mb-6">
        <label class="block text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider mb-1.5">{{ 'login.password' | translate }}</label>
        <input
          type="password"
          class="w-full h-9 border border-zinc-300 dark:border-zinc-600 rounded-lg px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full h-9 bg-zinc-900 hover:bg-zinc-700 dark:bg-zinc-100 dark:text-zinc-900 dark:hover:bg-zinc-300 text-white text-sm font-medium rounded-lg transition-colors disabled:opacity-50"
      >
        {{ loading ? ('login.submitting' | translate) : ('login.submit' | translate) }}
      </button>
    </form>

    <p class="text-sm text-zinc-500 dark:text-zinc-400 text-center mt-4">
      {{ 'login.noAccount' | translate }}
      <a routerLink="/register" class="text-zinc-900 dark:text-zinc-100 font-medium hover:underline">{{ 'login.register' | translate }}</a>
    </p>
  </div>
</div>
