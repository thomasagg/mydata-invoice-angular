<div class="min-h-screen bg-zinc-100 flex items-center justify-center">
  <div class="bg-white rounded-xl border border-zinc-200 shadow-sm p-8 w-full max-w-sm">
    <h1 class="text-xl font-bold text-zinc-900 mb-6">Sign in</h1>

    <div *ngIf="error" class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2 mb-4">
      {{ error }}
    </div>

    <form (ngSubmit)="submit()" #f="ngForm">
      <div class="mb-4">
        <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-1.5">Username</label>
        <input
          class="w-full h-9 border border-zinc-300 rounded-lg px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [(ngModel)]="username"
          name="username"
          required
        />
      </div>

      <div class="mb-6">
        <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-1.5">Password</label>
        <input
          type="password"
          class="w-full h-9 border border-zinc-300 rounded-lg px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full h-9 bg-zinc-900 hover:bg-zinc-700 text-white text-sm font-medium rounded-lg transition-colors disabled:opacity-50"
      >
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p class="text-sm text-zinc-500 text-center mt-4">
      Don't have an account?
      <a routerLink="/register" class="text-zinc-900 font-medium hover:underline">Register</a>
    </p>
  </div>
</div>
