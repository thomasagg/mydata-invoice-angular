<div class="p-8">
  <h1 class="text-xl font-bold text-zinc-900 mb-6">Dashboard</h1>
  <div class="grid grid-cols-4 gap-4">
    <div class="bg-white rounded-xl border border-zinc-200 shadow-sm p-5">
      <p class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Total Invoices</p>
      <p class="text-2xl font-bold text-zinc-900">{{ total }}</p>
    </div>
    <div class="bg-white rounded-xl border border-zinc-200 shadow-sm p-5">
      <p class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Accepted</p>
      <p class="text-2xl font-bold text-zinc-900">{{ accepted }}</p>
    </div>
    <div class="bg-white rounded-xl border border-zinc-200 shadow-sm p-5">
      <p class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Rejected</p>
      <p class="text-2xl font-bold text-zinc-900">{{ rejected }}</p>
    </div>
    <div class="bg-white rounded-xl border border-zinc-200 shadow-sm p-5">
      <p class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Cancelled</p>
      <p class="text-2xl font-bold text-zinc-900">{{ cancelled }}</p>
    </div>
  </div>
</div>
